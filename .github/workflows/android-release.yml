name: Android Release

# Tag a commit to ship: `git tag v0.1.0 && git push --tags`
# Produces a signed APK attached to a GitHub Release that testers download directly.
on:
  push:
    tags: ['v*']
  workflow_dispatch: # lets you build a test APK without cutting a tag

permissions:
  contents: write # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Android Gradle Plugin 8.13 targets JDK 17-21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web bundle
        # Not `npm run build`: the native build ships a self-destroying service
        # worker instead of a live one. See the comment in vite.config.js — a
        # worker inside the APK caches files that are already local and makes
        # the first launch after an update show the previous version.
        run: npm run build:native

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Check the secrets exist before Gradle does. An unset secret decodes
          # to an empty file that still passes an exists() check, so without
          # this the build dies in a Gradle stacktrace that says nothing useful.
          missing=""
          [ -n "$KEYSTORE_BASE64" ]  || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions. See README."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liferpg-release.jks"
          size=$(wc -c < "$RUNNER_TEMP/liferpg-release.jks")
          if [ "$size" -lt 1000 ]; then
            echo "::error::Decoded keystore is only ${size} bytes — KEYSTORE_BASE64 is truncated or not valid base64."
            exit 1
          fi
          echo "Keystore restored (${size} bytes)."

      - name: Assemble signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/liferpg-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Monotonic across runs so Android always treats a new build as an upgrade
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Confirm the APK is actually signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK not produced"; exit 1; }

          # An unsigned APK installs on nobody's phone, so fail loudly here
          # rather than let testers discover it. apksigner lives in whichever
          # build-tools version Gradle pulled down.
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$SIGNER" ]; then
            "$SIGNER" verify --print-certs "$APK"
          else
            echo "apksigner not found; falling back to signature-block check"
            unzip -l "$APK" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)' \
              || { echo "::error::APK has no signature block"; exit 1; }
          fi

          mv "$APK" "LifeRPG-${{ github.ref_name }}.apk"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: LifeRPG-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: |
            ## Install on Android

            1. Download **LifeRPG-${{ github.ref_name }}.apk** below on your phone.
            2. Open it. Android will say the app is from an unknown source — tap
               **Settings**, enable **Allow from this source**, then go back and tap **Install**.
            3. If you already have LifeRPG installed, this upgrades it and keeps your data.

            Requires Android 7.0 or newer. The app works fully offline; nothing is uploaded anywhere.

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeRPG-apk
          path: LifeRPG-*.apk
