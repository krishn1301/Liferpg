<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale=1, user-scalable=no` used to be here. Blocking pinch-zoom
         is an accessibility failure, recent iOS Safari ignores it anyway, and
         nothing in this design depends on the viewport being unzoomable. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a0b" />
    <meta
      name="description"
      content="Gamified offline habit tracker: streaks, XP, vows you keep by not slipping, medicines, and an end-of-day log."
    />

    <!-- iPhone installs through Share → Add to Home Screen; there is no install
         prompt on iOS and none of this is inferred from the manifest. Without
         apple-touch-icon, iOS uses a screenshot of the page as the home-screen
         icon, which is the difference between an app and a bookmark. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LifeRPG" />
    <!-- `black-translucent` puts the page under the status bar; the app already
         pads for it with env(safe-area-inset-top). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>LifeRPG</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
